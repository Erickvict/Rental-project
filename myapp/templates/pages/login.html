<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div
      class="h-screen w-screen bg-center bg-no-repeat bg-contain"
      style="background-image: url(&quot;/static/Images/carback.jpg&quot;)"
    >
      <div class="min-h-screen flex justify-center items-center">
        <div
          class="bg-white/10 backdrop-blur p-6 shadow w-full max-w-[400px] rounded"
        >
          <h3 class="text-center text-xl font-semibold mb-4">LOGIN</h3>

          <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
              <label class="block mb-1 font-medium "> Username </label>

              {{form.username}}
            </div>

            <div class="mb-4">
              <label class="block mb-1 font-medium"> Password </label>

              {{form.password}}
            </div>

            <button
              type="submit"
              class="w-full mb-2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded"
            >
              Login
            </button>

            <p class="text-center my-2">OR</p>

            <a href="{% url 'signup' %}">
              <button
                type="button"
                class="w-full border border-blue-600 text-blue-600 hover:bg-blue-50 py-2 rounded"
              >
                Need an Account? Create One
              </button>
            </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
