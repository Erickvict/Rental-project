<div class="flex justify-center items-center bg-[#f0f8ff] min-h-[90vh] p-4">
      <form class="w-full max-w-6xl">
        <div class="container mx-auto bg-gray-50 p-6 rounded-lg shadow-sm">
          <h3 class="text-center text-2xl font-medium mb-6">Booking Details</h3>

          {% comment %} section1 {% endcomment %}
          <div class="bg-sky-500/10 p-4 rounded-lg mb-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block mb-1 font-medium text-sm">Full Name</label>
                <input
                  type="text"
                  name="f_name"
                  placeholder="Full name"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm">D.O.B</label>
                <input
                  type="date"
                  name="d_ob"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Email Address</label
                >
                <input
                  type="email"
                  name="email_id"
                  placeholder="name@example.com"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Phone Number</label
                >
                <input
                  type="text"
                  name="phone_number"
                  placeholder="Phone number"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
            </div>
          </div>

          {% comment %} section2 {% endcomment %}
          <div class="bg-sky-500/10 p-4 rounded-lg mb-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Guardian Name</label
                >
                <input
                  type="text"
                  name="g_name"
                  placeholder="Guardian full name"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Guardian Phone No</label
                >
                <input
                  type="text"
                  name="g_phone"
                  placeholder="Phone number"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Aadhar Number</label
                >
                <input
                  type="text"
                  name="aadhar_no"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Driving License No</label
                >
                <input
                  type="text"
                  name="driving_no"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
            </div>
          </div>

          {% comment %} section3 {% endcomment %}
          <div class="bg-sky-500/10 p-4 rounded-lg mb-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Rental Start Date</label
                >
                <input
                  type="datetime-local"
                  name="rental_start"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm"
                  >Rental End Date</label
                >
                <input
                  type="datetime-local"
                  name="rental_end"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm">Address</label>
                <input
                  type="text"
                  name="add_ress"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
              <div>
                <label class="block mb-1 font-medium text-sm">Location</label>
                <input
                  type="text"
                  name="loc_ation"
                  required
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"
                />
              </div>
            </div>
          </div>

          
          <div class="flex justify-center mt-6 gap-2">
            <button
              type="button"
              class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 rounded-md bg-amber-400 text-black hover:bg-amber-500 transition-colors"
            >
              Next
            </button>
          </div>
        </div>
      </form>
    </div>
